[mcu cartographer]
serial: /dev/cartographer

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: -15
z_backlash: 0.00112
verbose: False

[cartographer coil]
temperature_coefficient: 0.003346
reference_temperature: 25.0

[cartographer scan]
mesh_runs: 2
probe_speed: 5.0
mesh_height: 3.0
mesh_direction: x
mesh_path: snake

[cartographer touch]
samples: 3
max_samples: 10

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: cartographer
